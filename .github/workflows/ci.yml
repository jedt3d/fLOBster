name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  analyze-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze desktop app
        run: flutter analyze apps/flobster_desktop

      - name: Test desktop app
        run: flutter test apps/flobster_desktop

      - name: Analyze Serverpod packages
        run: dart analyze server/flobster_server server/flobster_client
