name: flobster_core
description: "Core data persistence layer, models, and sync architecture for fLOBster."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.5.0
  drift: ^2.20.0
  postgres: ^3.1.0
  supabase_flutter: ^2.8.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.9
